apiVersion: v1
kind: ConfigMap
metadata:
  name: lepro-bridge-config
  namespace: lepro-debug
data:
  lepro-lab.toml: |
    [device]
    id = "3619294555"
    friendly_name = "patio-lights"

    [bridge]
    home_broker = "mqtt://mosquitto.lepro-debug.svc:1883"
    lepro_broker = "mqtts://mosquitto.lepro-debug.svc:8883"
    ca_file = "/certs/ca.pem"
    tls_server_name = "mqtt.example.home"
    tls_insecure = false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lepro-bridge
  namespace: lepro-debug
  labels:
    app: lepro-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lepro-bridge
  template:
    metadata:
      labels:
        app: lepro-bridge
    spec:
      containers:
        - name: lepro-bridge
          image: lepro-bridge:local
          imagePullPolicy: IfNotPresent
          args: ["-config", "/config/lepro-lab.toml"]
          env:
            - name: TZ
              value: UTC
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lepro-bridge-config
        - name: certs
          secret:
            secretName: lepro-mock-pki
