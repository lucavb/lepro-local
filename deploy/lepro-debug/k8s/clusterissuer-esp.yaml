# Dedicated LE issuer for IoT clients — RSA certs, X1-anchored chain when available.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-lepro-esp
spec:
  acme:
    email: admin@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-lepro-esp-account-key
    preferredChain: "ISRG Root X1"
    profile: classic
    solvers:
      - dns01:
          webhook:
            config:
              secretNamespace: cert-manager
              secretRef: netcup-api-credentials
            groupName: acme.example.home
            solverName: netcup
        selector:
          dnsZones:
            - example.home
